name = "cat-care-beta"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Live record timing: ingress NRT -> D1 primary IAD costs ~170-190ms/query.
# Run near the existing primary; this does not move D1 or static assets.
[placement]
region = "aws:us-east-1"

[browser]
binding = "REPORT_BROWSER"

# 照護站網站（beta/public）由 Worker Static Assets 直接服務。
# /webhook 與 /api/* 一律先進 Worker 程式。
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/webhook", "/api/*", "/healthz", "/admin/*", "/r/*"]

[[d1_databases]]
binding = "DB"
database_name = "cat-care-beta"
# 執行 `wrangler d1 create cat-care-beta` 後，把回傳的 database_id 貼到這裡
database_id = "90d45beb-2d37-4315-bad0-c9fd9a378a9b"

[observability.logs]
enabled = true

# 照護提醒：每個整點檢查一次，只發給「設定的發送時間 = 現在這個台北整點」的飼主
[triggers]
crons = ["0 * * * *"]

[vars]
# 部署後的網站網址（選填）。留空時會自動使用 Worker 本身的網址。
APP_BASE_URL = ""
# LINE LIFF app ID（建在「喵喵照護管家」Provider 底下的 Login channel，和機器人同 Provider → User ID 一致）
# 設了就啟用「在 LINE 內自動登入」＋「一鍵分享共同照護邀請」。
LIFF_ID = "2010761895-7VsJuJ3C"
# 上面 LIFF 所屬 LINE Login channel 的 Channel ID（驗證 id_token 用的 client_id）
LIFF_CHANNEL_ID = "2010761895"

# 機密請用 wrangler secret 設定，不要寫進這個檔案：
#   wrangler secret put LINE_CHANNEL_ACCESS_TOKEN   # 固定權杖（備援用）
#   wrangler secret put LINE_CHANNEL_SECRET         # 驗簽 + 自動換發用
#   wrangler secret put LINE_CHANNEL_ID             # 設了就啟用「權杖自動換發」，永不因過期斷線

[ai]
binding = "AI"
