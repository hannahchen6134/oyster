<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- LINE 圖文選單設計稿：以 1250×843 檢視、deviceScaleFactor 2 輸出 2500×1686 -->
<style>
  :root {
    --bg: #f7f4ee;
    --surface: #fffefb;
    --ink: #2b2a26;
    --muted: #8b867a;
    --line: #e3ddd0;
    --brand: #734921;
    --brand-deep: #5a3617;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1250px; height: 843px; overflow: hidden;
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .menu {
    display: grid; width: 100%; height: 100%;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr 1fr;
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .cell:nth-child(3n) { border-right: none; }
  .cell:nth-child(n+4) { border-bottom: none; }
  .cell.accent { background: var(--brand); }
  .cell.accent .label { color: #fff; }
  .cell.accent .cmd { color: rgba(255, 255, 255, 0.75); }
  .cell.accent svg { stroke: #fff; }
  svg { width: 64px; height: 64px; stroke: var(--brand); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-family: "Noto Serif TC", serif; font-size: 34px; font-weight: 600; letter-spacing: 0.06em; }
  .cmd { font-size: 19px; color: var(--muted); letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="menu">
    <div class="cell">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>
      <div class="label">今日總結</div>
      <div class="cmd">傳送「今天」</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 2.8v4M16 2.8v4"/></svg>
      <div class="label">月曆</div>
      <div class="cmd">傳送「月曆」</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M4.5 15.5l4-5 3.5 3 4.5-6 3 3.5"/></svg>
      <div class="label">近 7 天</div>
      <div class="cmd">傳送「近7天」</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M6 3.5v5a4 4 0 0 0 8 0v-5"/><path d="M10 12.5v3a4.5 4.5 0 0 0 9 0v-2"/><circle cx="19" cy="11" r="2.2"/></svg>
      <div class="label">回診資訊</div>
      <div class="cmd">傳送「回診」</div>
    </div>
    <div class="cell accent">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18M6.2 6.8h.01M8.8 6.8h.01"/></svg>
      <div class="label">開啟照護站</div>
      <div class="cmd">傳送「網站」取得連結</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M12 5.5c-1.6-1.6-4.2-2-6.5-1.2v14c2.3-.8 4.9-.4 6.5 1.2 1.6-1.6 4.2-2 6.5-1.2v-14c-2.3-.8-4.9-.4-6.5 1.2z"/><path d="M12 5.5v14"/></svg>
      <div class="label">使用說明</div>
      <div class="cmd">傳送「說明」</div>
    </div>
  </div>
</body>
</html>
