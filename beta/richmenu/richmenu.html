<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- LINE 圖文選單設計稿：以 1250×843 檢視、deviceScaleFactor 2 輸出 2500×1686
     v4 重排：對準「每天最常做的事」。
     上排＝每天要做的（記一筆／看今天／給醫生看，全部留在對話裡）。
     下排＝查看與前往（淺米帶：照護站／月曆／飲食回顧）。
     「記一筆」是每天最高頻動作，用品牌淡底 highlight。
     會離開對話開網站的兩格（照護站、飲食回顧）右上角加「網站 ↗」角標。 -->
<style>
  :root {
    --bg: #f7f4ee;
    --surface: #fffefb;
    --band: #f3eee3;
    --ink: #2b2a26;
    --muted: #8b867a;
    --line: #e3ddd0;
    --brand: #734921;
    --brand-deep: #5a3617;
    --tint: #efe6d5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1250px; height: 843px; overflow: hidden;
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .menu {
    display: grid; width: 100%; height: 100%;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr 1fr;
  }
  .cell {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .cell:nth-child(3n) { border-right: none; }
  .cell:nth-child(n+4) { border-bottom: none; }
  /* 下排「查看與前往」區帶：淺米底，和上排的白底分開 */
  .cell.zone-view { background: var(--band); }
  /* 上排與下排之間的分隔：較深一階的規線，強化「兩區」 */
  .cell:nth-child(4), .cell:nth-child(5), .cell:nth-child(6) { border-top: 2px solid #d9d0be; }
  /* 記一筆：每天最常做的動作，品牌淡底 highlight（不用整塊深咖啡，較不搶眼、較耐看） */
  .cell.primary { background: var(--tint); }
  svg { width: 62px; height: 62px; stroke: var(--brand); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-family: "Noto Serif TC", serif; font-size: 34px; font-weight: 600; letter-spacing: 0.06em; }
  .cmd { font-size: 19px; color: var(--muted); letter-spacing: 0.08em; }
  .cell.primary .label { color: var(--brand-deep); }
  /* 開網站角標：右上角「網站 ↗」，代表會離開對話 */
  .ext {
    position: absolute; top: 20px; right: 22px;
    display: flex; align-items: center; gap: 6px;
    font-size: 16px; color: var(--brand); letter-spacing: 0.06em;
    background: rgba(115, 73, 33, 0.10); border-radius: 999px; padding: 5px 12px;
  }
  .ext svg { width: 20px; height: 20px; stroke: var(--brand); stroke-width: 2.2; }
</style>
</head>
<body>
  <div class="menu">
    <!-- 上排：每天要做的（留在對話） -->
    <div class="cell primary">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg>
      <div class="label">記一筆</div>
      <div class="cmd">水・飯・藥，打字或點</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="17" rx="3"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg>
      <div class="label">看今天</div>
      <div class="cmd">今天吃喝了多少</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M7 3.5v5a5 5 0 0 0 10 0v-5"/><path d="M12 13.5v2.5a4 4 0 0 0 4 4h1"/><circle cx="19" cy="20" r="1.6"/></svg>
      <div class="label">給醫生看</div>
      <div class="cmd">回診重點整理</div>
    </div>
    <!-- 下排：查看與前往（淺米帶） -->
    <div class="cell zone-view">
      <div class="ext"><span>網站</span><svg viewBox="0 0 24 24"><path d="M7 17 L17 7"/><path d="M8.5 7 H17 V15.5"/></svg></div>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M7.2 8.6 L5.6 3.8 L10.2 6.4"/><path d="M16.8 8.6 L18.4 3.8 L13.8 6.4"/><path d="M9.5 13.2 q1.2 1.2 2.5 0"/><path d="M12 13.2 q1.2 1.2 2.5 0"/></svg>
      <div class="label">喵喵照護站</div>
      <div class="cmd">開啟網站</div>
    </div>
    <div class="cell zone-view">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 2.8v4M16 2.8v4"/></svg>
      <div class="label">照護月曆</div>
      <div class="cmd">在對話看月曆</div>
    </div>
    <div class="cell zone-view">
      <div class="ext"><span>網站</span><svg viewBox="0 0 24 24"><path d="M7 17 L17 7"/><path d="M8.5 7 H17 V15.5"/></svg></div>
      <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 19v-6"/><path d="M12.5 19V9"/><path d="M17 19v-8"/><path d="M8 8.5 12.5 6 17 7.5"/></svg>
      <div class="label">飲食回顧</div>
      <div class="cmd">近 30 天吃喝比例</div>
    </div>
  </div>
</body>
</html>
