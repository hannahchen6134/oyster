<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- LINE 圖文選單設計稿：以 1250×843 檢視、deviceScaleFactor 2 輸出 2500×1686 -->
<style>
  :root {
    --bg: #f7f4ee;
    --surface: #fffefb;
    --ink: #2b2a26;
    --muted: #8b867a;
    --line: #e3ddd0;
    --brand: #734921;
    --brand-deep: #5a3617;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1250px; height: 843px; overflow: hidden;
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .menu {
    display: grid; width: 100%; height: 100%;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr 1fr;
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .cell:nth-child(3n) { border-right: none; }
  .cell:nth-child(n+4) { border-bottom: none; }
  .cell.accent { background: var(--brand); }
  .cell.accent .label { color: #fff; }
  .cell.accent .cmd { color: rgba(255, 255, 255, 0.75); }
  .cell.accent svg { stroke: #fff; }
  svg { width: 64px; height: 64px; stroke: var(--brand); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-family: "Noto Serif TC", serif; font-size: 34px; font-weight: 600; letter-spacing: 0.06em; }
  .cmd { font-size: 19px; color: var(--muted); letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="menu">
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/></svg>
      <div class="label">快速紀錄</div>
      <div class="cmd">傳送「紀錄」</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="17" rx="3"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg>
      <div class="label">今日確認</div>
      <div class="cmd">傳送「今天」</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><path d="M7 3.5v5a5 5 0 0 0 10 0v-5"/><path d="M12 13.5v2.5a4 4 0 0 0 4 4h1"/><circle cx="19" cy="20" r="1.6"/></svg>
      <div class="label">回診摘要</div>
      <div class="cmd">傳送「回診摘要」</div>
    </div>
    <div class="cell accent">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M7.2 8.6 L5.6 3.8 L10.2 6.4"/><path d="M16.8 8.6 L18.4 3.8 L13.8 6.4"/><path d="M9.5 13.2 q1.2 1.2 2.5 0"/><path d="M12 13.2 q1.2 1.2 2.5 0"/></svg>
      <div class="label">喵喵照護站</div>
      <div class="cmd">點我直接開啟網站</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 2.8v4M16 2.8v4"/></svg>
      <div class="label">月曆</div>
      <div class="cmd">傳送「月曆」</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="4" ry="3.2"/><circle cx="6.8" cy="10.6" r="1.8"/><circle cx="12" cy="8.8" r="1.8"/><circle cx="17.2" cy="10.6" r="1.8"/></svg>
      <div class="label">安心上手</div>
      <div class="cmd">傳送「安心上手」</div>
    </div>
  </div>
</body>
</html>
