<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<!-- 近七天卡示意（實際在 LINE 內以 Flex 渲染，比例／字級接近） -->
<style>
  :root{ --brown:#734921; --brownDeep:#5a3617; --body:#faf6ee; --ink:#3a2f22; --muted:#9A8B7A; --line:#EAE2D2; --track:#EFEBE0; --water:#7C9070; --kcal:#C08E5E; }
  *{margin:0;box-sizing:border-box;font-family:"PingFang TC","Noto Sans TC",sans-serif;}
  body{background:#dfd6c6;padding:26px;}
  .card{width:420px;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);background:var(--body);}
  .hd{background:linear-gradient(135deg,#7c5127,#5a3617);color:#f6ecdd;padding:16px 20px;font-size:19px;font-weight:700;letter-spacing:.04em;}
  .bd{padding:18px 20px;}
  .legend{display:flex;gap:8px;align-items:center;justify-content:center;font-size:11px;color:var(--muted);margin-bottom:6px;}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .legend .gap{width:8px;}
  .day{display:flex;align-items:center;gap:9px;margin-top:12px;}
  .date{flex:3;font-size:11px;color:var(--muted);}
  .date.warn{color:#BF3B20;}
  .bars{flex:8;display:flex;flex-direction:column;gap:3px;}
  .track{height:7px;border-radius:3px;background:var(--track);overflow:hidden;}
  .fill{height:7px;border-radius:3px;}
  .vals{flex:5;display:flex;flex-direction:column;text-align:right;}
  .vals .w{font-size:11px;color:var(--water);line-height:1.35;}
  .vals .k{font-size:11px;color:var(--kcal);line-height:1.35;}
  .sep{height:1px;background:var(--line);margin:18px 0 14px;}
  .stats{display:flex;gap:12px;}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .u{font-size:11px;color:var(--muted);margin-top:2px;}
  .ft{padding:12px 16px 16px;}
  .btn{background:var(--brown);color:#fff;text-align:center;padding:11px;border-radius:12px;font-size:14px;font-weight:600;}
</style></head>
<body>
  <div class="card">
    <div class="hd">近 7 天・蚵仔</div>
    <div class="bd">
      <div class="legend"><span class="dot" style="background:#7C9070"></span>水分 ml<span class="gap"></span><span class="dot" style="background:#C08E5E"></span>熱量 kcal</div>

      <div class="day"><div class="date">2/1</div><div class="bars"><div class="track"><div class="fill" style="width:47%;background:#7C9070"></div></div><div class="track"><div class="fill" style="width:56%;background:#C08E5E"></div></div></div><div class="vals"><div class="w">80</div><div class="k">150</div></div></div>
      <div class="day"><div class="date">2/2</div><div class="bars"><div class="track"><div class="fill" style="width:56%;background:#7C9070"></div></div><div class="track"><div class="fill" style="width:63%;background:#C08E5E"></div></div></div><div class="vals"><div class="w">95</div><div class="k">170</div></div></div>
      <div class="day"><div class="date">2/3</div><div class="bars"><div class="track"></div><div class="track"></div></div><div class="vals"><div class="w">—</div><div class="k">—</div></div></div>
      <div class="day"><div class="date">2/4</div><div class="bars"><div class="track"><div class="fill" style="width:74%;background:#7C9070"></div></div><div class="track"><div class="fill" style="width:78%;background:#C08E5E"></div></div></div><div class="vals"><div class="w">125</div><div class="k">210</div></div></div>
      <div class="day"><div class="date">2/5</div><div class="bars"><div class="track"><div class="fill" style="width:82%;background:#7C9070"></div></div><div class="track"><div class="fill" style="width:85%;background:#C08E5E"></div></div></div><div class="vals"><div class="w">140</div><div class="k">230</div></div></div>
      <div class="day"><div class="date warn">2/6 ⚠</div><div class="bars"><div class="track"><div class="fill" style="width:91%;background:#7C9070"></div></div><div class="track"><div class="fill" style="width:93%;background:#C08E5E"></div></div></div><div class="vals"><div class="w">155</div><div class="k">250</div></div></div>
      <div class="day"><div class="date">2/7</div><div class="bars"><div class="track"><div class="fill" style="width:100%;background:#7C9070"></div></div><div class="track"><div class="fill" style="width:100%;background:#C08E5E"></div></div></div><div class="vals"><div class="w">170</div><div class="k">270</div></div></div>

      <div class="sep"></div>
      <div class="stats">
        <div class="stat"><div class="n" style="color:#7C9070">128</div><div class="u">日均水分 ml</div></div>
        <div class="stat"><div class="n" style="color:#C08E5E">213</div><div class="u">日均熱量 kcal</div></div>
      </div>
    </div>
    <div class="ft"><div class="btn">看體重・水分・熱量折線圖</div></div>
  </div>
</body></html>
